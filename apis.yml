name: Vehicles.dev
description: >-
  Automotive vehicle data platform offering a live REST API for VIN decoding, specifications, recalls, market valuation,
  depreciation, ownership costs, listings, price history, and photos, backed by federal sources (NHTSA vPIC, NHTSA
  recalls, EPA) and a continuously crawled US dealer-listings store. Ships an OpenAPI 3.1 contract and a local MCP
  server exposing all ten endpoints as read-only tools.
