currency: USD
billing_period: month
price_catalog_version: '2026-08-07'
plan_count: 3
billing_model:
  unit: per successful call, metered at the endpoint level
  success_only: true
  success_only_note: >-
    Every endpoint is successOnly. A credit reservation is placed before the handler runs and settles
    only on 2xx; any 4xx or 5xx — including 429 rate-limit rejections and upstream outages — releases
    the reservation. A failed call costs nothing.
  prepaid: true
  prepaid_note: >-
    Metered data fees are prepaid from credits on every plan. A paid plan buys the rate limit, the
    lower unit prices and endpoint access — never an overage bill. Exhaustion returns
    402 insufficient_credits.
  free_credit: '$10 one-time credit balance on every new account; never resets; spendable on any endpoint priced on the Pro plan.'
  catalog_pinning: >-
    Prices are not quoted live at call time. A subscription pins a catalog version, every metered
    event records the unit price actually applied, and a new catalog is adopted at the start of the
    next UTC monthly period — so a price change never reprices past calls and never lands mid-period.
  machine_readable_balance: false
  machine_readable_balance_note: >-
    Entitlement, credit balance and usage are visible only in the dashboard. Metered responses carry
    no balance or usage headers, so a server-to-server integration cannot pre-flight burn-down;
    402 insufficient_credits is the only programmatic signal.
plans:
