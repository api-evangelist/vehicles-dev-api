  /v1/employment/market-analytics:
    get:
      operationId: getEmploymentMarketAnalytics
      tags:
      - Employment
      security:
      - apiKeyBearer: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - medianSalaryUsd
                - postings30d
                - role
                - source
                - yoyGrowthPct
                properties:
                  medianSalaryUsd:
                    type: integer
                  postings30d:
                    type: integer
                  role:
                    type: string
                  source:
                    type: string
