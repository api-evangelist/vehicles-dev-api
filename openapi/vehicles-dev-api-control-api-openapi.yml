openapi: 3.2.0
info:
  description: 'Vehicle identity and intelligence data — VIN decode, market value, listings, depreciation, reports, listing history, photos, specifications, recalls, and ownership costs — plus the account, API-key, and billing control plane. Data endpoints authenticate with a product API key (`Authorization: Bearer <key>`); control-plane endpoints use a dashboard session token. Errors are RFC 9457 application/problem+json, and every response carries an x-request-id header.'
  title: Vehicles.dev Control API
  version: 0.0.0
servers:
- description: Vehicles.dev API
  url: https://api.vehicles.dev
tags:
- name: Control
paths:
  /v1/control/bootstrap:
    post:
      operationId: provisionControlIdentity
      tags:
      - Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountName
              properties:
                accountName:
                  type: string
                  maxLength: 120
                  minLength: 1
              additionalProperties: false
      security:
      - workosBearer: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - accountProductId
                - principalId
                - product
                - role
                properties:
                  accountProductId:
                    type: string
                    format: uuid
                  principalId:
                    type: string
                    format: uuid
                  product:
                    anyOf:
                    - type: string
                      enum:
                      - employment
                    - type: string
                      enum:
                      - vehicles
                  role:
                    anyOf:
                    - type: string
                      enum:
                      - owner
                    - type: string
                      enum:
                      - admin
                    - type: string
                      enum:
                      - developer
                    - type: string
                      enum:
                      - billing
                additionalProperties: false
        '400':
          description: RFC 9457 problem details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/def-0'
        '401':
          description: RFC 9457 problem details.
          content:
            application/problem+json:
              schema:
