  url: https://vehicles.dev/docs#support
  required_with_report: [x-request-id, UTC timestamp, endpoint and parameters with the key redacted to its last four characters]
usage_terms:
  url: https://vehicles.dev/docs#support-terms
  separate_tos_page: false
  note: >-
    "This page is the current statement of usage rights — there is no separate terms-of-service,
    acceptable-use or DPA page yet." Standard plans cover use inside your own product or internal
    systems; bulk redistribution or resale of raw records needs a separate written agreement. Photo
    URLs point at CDNs owned by the source marketplace and the imagery is not sublicensed.
